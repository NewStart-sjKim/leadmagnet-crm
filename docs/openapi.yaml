openapi: 3.1.0
info:
  title: 리드마그넷 CRM 운영 시스템 API
  version: 1.1.0
  description: |
    운영자가 AI로 만든 HTML 신청 폼을 등록하고, 캠페인/커스텀 폼을 만들어 채널별 링크로 배포한 뒤
    방문·신청·전환 데이터를 확인하는 API 입니다.

    ## 두 개의 origin
    | 서버 | 역할 | 인증 |
    |---|---|---|
    | **admin** (`ADMIN_ORIGIN`) | 인증, 템플릿·캠페인·폼 관리, 배포 링크, 성과, CRM 명단 | 세션 쿠키 `lm_admin_session` |
    | **forms** (`FORMS_ORIGIN`) | 공개 폼 서빙, 공개 제출 | 없음 (익명) |

    관리자 API 와 공개 폼이 다른 origin 에서 서빙되는 이유는 `docs/adr/0001-untrusted-html-isolation.md` 를 참고하세요.

    ## 인증
    `POST /api/auth/login` 성공 시 `Set-Cookie: lm_admin_session=…; HttpOnly; SameSite=Strict` 가 발급됩니다
    (프로덕션에서는 `Secure` 추가, 유효기간 7일). 이후 `/api/admin/**` 요청에 쿠키를 그대로 보내면 됩니다.

    - 쿠키가 없거나 만료·위조되면 `401`
    - `/api/admin/**`, `/api/auth/**` 요청의 `Origin` 이 관리자 origin 과 다르거나 `Sec-Fetch-Site: cross-site` 이면
      쿠키가 있어도 `403` (CSRF 방어)
    - 다른 운영자의 리소스는 존재하더라도 `404` (존재 여부 비노출)

    ## 오류 형식
    모든 오류는 `{ "error": string, "details"?: object }` 형태입니다.

    | 상태 | 의미 |
    |---|---|
    | `400` | 본문이 JSON 이 아니거나 검증 실패. 검증 실패 시 `details` 는 `{ formErrors: string[], fieldErrors: { [필드]: string[] } }` |
    | `401` | 세션 없음 · 만료 · 위조 |
    | `403` | 다른 origin 에서 시작된 요청 |
    | `404` | 리소스 없음 (다른 운영자의 리소스 포함) |
    | `409` | 상태 충돌 (slug 중복, 사용 중인 템플릿·트래픽 있는 링크 삭제) |
    | `410` | 마감된 폼 (공개 API) |
    | `413` | 제출 본문 64KB 초과 (공개 API) |
    | `500` | `{ "error": "Internal Server Error" }` |

servers:
  - url: /
    description: admin — 이 문서를 서빙하는 origin (상대 경로라 배포 도메인에 자동으로 맞음)
  - url: http://localhost:3001
    description: forms — 서빙 시 FORMS_ORIGIN 으로 치환됨 (아래는 로컬 기본값)

# 기본값: 관리자 세션 필요. 로그인·공개 API 는 오퍼레이션에서 덮어쓴다.
security:
  - sessionCookie: []

tags:
  - name: 인증
  - name: HTML 템플릿
  - name: 캠페인
  - name: 폼
  - name: 배포 링크
  - name: 성과
  - name: CRM 명단
  - name: 공개 폼 (forms origin)

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lm_admin_session

  responses:
    BadRequest:
      description: 본문이 JSON 이 아니거나 검증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            validation:
              summary: 검증 실패
              value: { error: "Validation failed", details: { formErrors: [], fieldErrors: { name: ["Required"] } } }
            invalidJson:
              summary: JSON 이 아님
              value: { error: "Invalid JSON body" }
    Unauthorized:
      description: 세션 없음 · 만료 · 위조
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Unauthorized" }
    Forbidden:
      description: 다른 origin 에서 시작된 요청 (CSRF 차단)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Forbidden (cross-site request)" }
    NotFound:
      description: 리소스 없음 (다른 운영자의 리소스도 404)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Deleted:
      description: 삭제됨
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Ok" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details:
          type: object
          description: "검증 실패 시 zod flatten 결과: { formErrors, fieldErrors }"
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    Operator:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    Channel:
      type: string
      enum: [INSTAGRAM, X, YOUTUBE, THREADS]
    CampaignStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, ARCHIVED]
      description: "PAUSED 또는 ARCHIVED 이면 공개 폼이 410 으로 마감된다. 생성 시 기본값은 ACTIVE"

    Template:
      type: object
      description: 목록·등록 응답용 (원문 HTML 제외)
      required: [id, name, fileName, sizeBytes, fieldNames, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer }
        fieldNames:
          type: array
          items: { type: string }
          description: 업로드 시 `<form>` 안에서 추출한 name 속성 목록
        createdAt: { type: string, format: date-time }
    TemplateDetail:
      description: 상세 응답용 (원문 HTML 포함)
      allOf:
        - $ref: "#/components/schemas/Template"
        - type: object
          required: [operatorId, html]
          properties:
            operatorId: { type: string }
            html: { type: string, description: 등록한 원문 HTML (정화하지 않음) }

    Campaign:
      type: object
      required: [id, operatorId, name, description, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        operatorId: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FormRecord:
      type: object
      description: 폼 레코드 (HTML 스냅샷 제외)
      required: [id, campaignId, templateId, slug, title, successMessage, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        campaignId: { type: string }
        templateId: { type: string }
        slug: { type: string, description: "공개 URL 경로: {FORMS_ORIGIN}/f/{slug}" }
        title: { type: string }
        successMessage: { type: string, description: "신청 완료 시 표시할 문구. 기본값: 신청이 완료되었습니다. 감사합니다!" }
        isActive: { type: boolean, description: false 면 공개 폼이 410 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Form:
      description: 폼 레코드 + 공개 URL
      allOf:
        - $ref: "#/components/schemas/FormRecord"
        - type: object
          required: [publicUrl]
          properties:
            publicUrl: { type: string, format: uri, example: "http://localhost:3001/f/ebook-2026" }
    FormSummary:
      type: object
      description: 폼 목록 응답용 (캠페인 이름 포함, 완료 메시지·수정 시각 제외)
      required: [id, campaignId, templateId, slug, title, isActive, createdAt, campaignName, publicUrl]
      properties:
        id: { type: string }
        campaignId: { type: string }
        templateId: { type: string }
        slug: { type: string }
        title: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        campaignName: { type: string }
        publicUrl: { type: string, format: uri }

    LinkRecord:
      type: object
      description: 배포 링크 레코드
      required: [id, formId, channel, code, label, createdAt]
      properties:
        id: { type: string }
        formId: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        code: { type: string, description: "채널 접두어 + 랜덤 7자 (ig_, x_, yt_, th_)", example: ig_3qpnyi0 }
        label: { type: [string, "null"], description: "같은 채널의 링크를 구분하는 이름 (예: 스토리)" }
        createdAt: { type: string, format: date-time }
    Link:
      description: 배포 링크 레코드 + 채널에 게시할 URL
      allOf:
        - $ref: "#/components/schemas/LinkRecord"
        - type: object
          required: [url]
          properties:
            url: { type: string, format: uri, example: "http://localhost:3001/f/ebook-2026?c=ig_3qpnyi0" }

    Metrics:
      type: object
      description: |
        지표 정의는 ADR-0004.
        - visits: 공개 폼 페이지(`/f/{slug}`) 로드 횟수. 미리보기(`/p/{slug}`)는 세지 않는다
        - visitors: 고유 방문자 수 (forms origin 의 1st-party 쿠키 `lm_vid`)
        - leads: 신청 수
        - conversionRate: leads / visitors (visitors 가 0 이면 0). 소수 4자리 반올림 (0.5 = 50%)
      required: [visits, visitors, leads, conversionRate]
      properties:
        visits: { type: integer }
        visitors: { type: integer }
        leads: { type: integer }
        conversionRate: { type: number, minimum: 0 }
    CampaignStats:
      allOf:
        - $ref: "#/components/schemas/Metrics"
        - type: object
          required: [campaignId, name, status, formCount]
          properties:
            campaignId: { type: string }
            name: { type: string }
            status: { $ref: "#/components/schemas/CampaignStatus" }
            formCount: { type: integer }
    ChannelStats:
      allOf:
        - $ref: "#/components/schemas/Metrics"
        - type: object
          required: [channel]
          properties:
            channel:
              type: string
              enum: [INSTAGRAM, X, YOUTUBE, THREADS, DIRECT]
              description: DIRECT = 배포 링크 코드 없이(또는 모르는 코드로) 들어온 방문·신청

    Lead:
      type: object
      required: [id, name, email, phone, payload, createdAt, formId, formTitle, campaignId, campaignName, channel, linkLabel]
      properties:
        id: { type: string }
        name: { type: [string, "null"], description: payload 에서 추출해 승격한 값 (없으면 null) }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        payload:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: { type: string }
          description: 폼의 모든 필드 (name → 값). 같은 name 이 여러 개면 배열
        createdAt: { type: string, format: date-time }
        formId: { type: string }
        formTitle: { type: string }
        campaignId: { type: string }
        campaignName: { type: string }
        channel:
          oneOf:
            - $ref: "#/components/schemas/Channel"
            - type: "null"
          description: null 이면 직접 유입 (DIRECT)
        linkLabel: { type: [string, "null"] }

paths:
  # ───────────────────────────── 인증 ─────────────────────────────
  /api/auth/login:
    post:
      tags: [인증]
      summary: 로그인
      description: 이메일은 소문자로 정규화해 비교합니다. 계정이 없을 때와 비밀번호가 틀릴 때 같은 메시지를 돌려줍니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
            example: { email: admin@example.com, password: "admin1234!" }
      responses:
        "200":
          description: "성공. Set-Cookie 로 lm_admin_session 발급"
          headers:
            Set-Cookie:
              schema: { type: string }
              example: "lm_admin_session=…; Path=/; Expires=…; HttpOnly; SameSite=Strict (프로덕션은 Secure 추가)"
          content:
            application/json:
              schema:
                type: object
                required: [operator]
                properties:
                  operator: { $ref: "#/components/schemas/Operator" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: 이메일 또는 비밀번호 불일치 (계정 존재 여부 비노출)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "이메일 또는 비밀번호가 올바르지 않습니다" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/logout:
    post:
      tags: [인증]
      summary: 로그아웃 (세션 삭제)
      description: 쿠키가 없어도 200 입니다. 응답에서 쿠키를 즉시 만료(`Max-Age=0`)시킵니다.
      security: [{}, { sessionCookie: [] }]
      responses:
        "200":
          description: 로그아웃됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/me:
    get:
      tags: [인증]
      summary: 현재 운영자
      responses:
        "200":
          description: 로그인한 운영자
          content:
            application/json:
              schema:
                type: object
                required: [operator]
                properties:
                  operator: { $ref: "#/components/schemas/Operator" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── 템플릿 ─────────────────────────────
  /api/admin/templates:
    get:
      tags: [HTML 템플릿]
      summary: 템플릿 목록 (원문 제외, 최신순)
      responses:
        "200":
          description: 템플릿 목록
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [HTML 템플릿]
      summary: 단일 .html 파일 등록
      description: |
        검증 규칙: 확장자 `.html`/`.htm`, 0 < 크기 ≤ 512KB, `<form>` 요소 존재.
        HTML 은 **정화하지 않고 원문 그대로** 저장합니다 (격리는 origin 분리 + CSP 로, ADR-0001).
        `<script>` 가 포함되면 등록은 되지만 `warnings` 에 안내가 담깁니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string, maxLength: 100, description: 생략 시 확장자를 뺀 파일명 사용 }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema:
                type: object
                required: [template, warnings]
                properties:
                  template: { $ref: "#/components/schemas/Template" }
                  warnings:
                    type: array
                    items: { type: string }
        "400":
          description: 파일 검증 실패
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noForm: { value: { error: "HTML 안에 <form> 요소가 있어야 신청 폼으로 사용할 수 있습니다" } }
                notHtml: { value: { error: ".html 파일만 등록할 수 있습니다" } }
                tooLarge: { value: { error: "파일은 512KB 이하여야 합니다" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [HTML 템플릿]
      summary: 템플릿 상세 (원문 포함)
      responses:
        "200":
          description: 템플릿 상세
          content:
            application/json:
              schema:
                type: object
                required: [template]
                properties:
                  template: { $ref: "#/components/schemas/TemplateDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [HTML 템플릿]
      summary: 템플릿 삭제
      description: 폼은 템플릿 원문을 스냅샷으로 들고 있지만, 어떤 템플릿으로 만들었는지 추적하기 위해 참조 중인 템플릿은 지울 수 없습니다 (ADR-0002).
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 이 템플릿으로 만든 폼이 있음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "이 템플릿으로 만든 폼이 있어 삭제할 수 없습니다" }

  # ───────────────────────────── 캠페인 ─────────────────────────────
  /api/admin/campaigns:
    get:
      tags: [캠페인]
      summary: 캠페인 목록 (최신순)
      responses:
        "200":
          description: 캠페인 목록
          content:
            application/json:
              schema:
                type: object
                required: [campaigns]
                properties:
                  campaigns:
                    type: array
                    items: { $ref: "#/components/schemas/Campaign" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [캠페인]
      summary: 캠페인 생성 (기본 상태 ACTIVE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
            example: { name: "9월 무료 전자책 배포" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                required: [campaign]
                properties:
                  campaign: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/campaigns/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [캠페인]
      summary: 캠페인 상세 + 폼 + 배포 링크
      description: |
        폼·링크는 DB 레코드 그대로입니다. **`publicUrl` 과 링크 `url` 은 포함되지 않습니다** —
        URL 이 필요하면 `GET /api/admin/forms/{id}` 를 쓰세요.
      responses:
        "200":
          description: 캠페인 상세
          content:
            application/json:
              schema:
                type: object
                required: [campaign, forms]
                properties:
                  campaign: { $ref: "#/components/schemas/Campaign" }
                  forms:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/FormRecord"
                        - type: object
                          required: [links]
                          properties:
                            links:
                              type: array
                              items: { $ref: "#/components/schemas/LinkRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [캠페인]
      summary: 이름 · 설명 · 상태 변경
      description: 보낸 필드만 바뀝니다. `status` 를 `PAUSED`/`ARCHIVED` 로 바꾸면 이 캠페인의 모든 공개 폼이 즉시 410 이 됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: [string, "null"], maxLength: 1000 }
                status: { $ref: "#/components/schemas/CampaignStatus" }
            example: { status: PAUSED }
      responses:
        "200":
          description: 변경됨
          content:
            application/json:
              schema:
                type: object
                required: [campaign]
                properties:
                  campaign: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [캠페인]
      summary: 캠페인 삭제 (폼 · 링크 · 방문 · 리드 cascade)
      description: 되돌릴 수 없습니다. 리드(CRM 명단)까지 함께 삭제됩니다 (ADR-0002).
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── 폼 ─────────────────────────────
  /api/admin/forms:
    get:
      tags: [폼]
      summary: 폼 목록 (최신순)
      parameters:
        - { name: campaignId, in: query, schema: { type: string }, description: 이 캠페인의 폼만 }
      responses:
        "200":
          description: 폼 목록
          content:
            application/json:
              schema:
                type: object
                required: [forms]
                properties:
                  forms:
                    type: array
                    items: { $ref: "#/components/schemas/FormSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [폼]
      summary: 커스텀 신청 폼 생성
      description: 템플릿 HTML 을 **스냅샷** 으로 복사해 저장합니다. 이후 템플릿을 바꿔도 배포된 폼은 영향받지 않습니다 (ADR-0002).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId, templateId, title]
              properties:
                campaignId: { type: string, minLength: 1 }
                templateId: { type: string, minLength: 1 }
                title: { type: string, minLength: 1, maxLength: 100 }
                slug:
                  type: string
                  pattern: "^[a-z0-9-]+$"
                  minLength: 3
                  maxLength: 60
                  description: "생략 시 자동 생성 (form-xxxxxxxx)"
                successMessage: { type: string, maxLength: 300, description: 생략 시 기본 문구 }
            example: { campaignId: "…", templateId: "…", title: "전자책 신청", slug: ebook-2026 }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                required: [form]
                properties:
                  form: { $ref: "#/components/schemas/Form" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 캠페인 또는 템플릿 없음 (다른 운영자 소유 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                campaign: { value: { error: "캠페인을 찾을 수 없습니다" } }
                template: { value: { error: "템플릿을 찾을 수 없습니다" } }
        "409":
          description: slug 중복
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "이미 사용 중인 slug 입니다" }

  /api/admin/forms/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [폼]
      summary: 폼 상세 + 배포 링크 (URL 포함)
      responses:
        "200":
          description: 폼 상세
          content:
            application/json:
              schema:
                type: object
                required: [form, links]
                properties:
                  form: { $ref: "#/components/schemas/Form" }
                  links:
                    type: array
                    description: 생성순
                    items: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [폼]
      summary: 제목 · 완료 메시지 · 공개 여부 변경
      description: 보낸 필드만 바뀝니다. slug 와 HTML 스냅샷은 바꿀 수 없습니다 (이미 배포된 링크 보호).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                successMessage: { type: string, maxLength: 300 }
                isActive: { type: boolean, description: false 면 공개 폼이 410 }
            example: { isActive: false }
      responses:
        "200":
          description: 변경됨
          content:
            application/json:
              schema:
                type: object
                required: [form]
                properties:
                  form: { $ref: "#/components/schemas/Form" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── 배포 링크 ─────────────────────────────
  /api/admin/forms/{id}/links:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 폼 id }
    get:
      tags: [배포 링크]
      summary: 채널별 배포 링크 목록
      responses:
        "200":
          description: 배포 링크 목록
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items: { $ref: "#/components/schemas/Link" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [배포 링크]
      summary: 채널용 배포 링크 생성
      description: |
        코드는 채널 접두어 + 랜덤 (`ig_…`, `x_…`, `yt_…`, `th_…`).
        같은 채널에 여러 링크(프로필·스토리 등)를 만들 수 있으며 `label` 로 구분합니다.
        생성된 `url` 을 해당 채널에 게시하면 방문·신청이 그 링크(와 채널)로 귀속됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { $ref: "#/components/schemas/Channel" }
                label: { type: string, maxLength: 60 }
            example: { channel: INSTAGRAM, label: 스토리 }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                required: [link]
                properties:
                  link: { $ref: "#/components/schemas/Link" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/forms/{id}/links/{linkId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 폼 id }
      - { name: linkId, in: path, required: true, schema: { type: string }, description: 배포 링크 id }
    delete:
      tags: [배포 링크]
      summary: 배포 링크 삭제 (트래픽이 없는 링크만)
      description: |
        `visits.link_id` / `leads.link_id` 는 `on delete set null` 이라, 방문·신청이 기록된 링크를
        지우면 그 트래픽이 조용히 **DIRECT** 로 재분류되어 채널별 성과가 왜곡됩니다.
        그래서 이미 트래픽이 있는 링크는 `409` 로 거부하고, 잘못 만든 빈 링크만 정리할 수 있게 합니다 (ADR-0002).
      responses:
        "200": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 방문 · 신청이 기록된 링크
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "방문 12건 · 신청 3건이 기록된 링크입니다. 삭제하면 성과가 직접 유입으로 바뀌어 지울 수 없습니다" }

  # ───────────────────────────── 성과 ─────────────────────────────
  /api/admin/stats/campaigns:
    get:
      tags: [성과]
      summary: 캠페인별 방문 · 방문자 · 신청 · 전환율
      description: 캠페인 생성순. 트래픽이 없는 캠페인도 0 으로 포함됩니다.
      responses:
        "200":
          description: 캠페인별 성과
          content:
            application/json:
              schema:
                type: object
                required: [campaigns]
                properties:
                  campaigns:
                    type: array
                    items: { $ref: "#/components/schemas/CampaignStats" }
              example:
                campaigns:
                  - { campaignId: "…", name: "9월 전자책 캠페인", status: ACTIVE, formCount: 1, visits: 6, visitors: 4, leads: 2, conversionRate: 0.5 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/stats/channels:
    get:
      tags: [성과]
      summary: 채널별 성과
      description: 항상 INSTAGRAM, X, YOUTUBE, THREADS, DIRECT 순서로 5개 행을 반환합니다 (데이터가 없으면 0).
      parameters:
        - { name: campaignId, in: query, schema: { type: string }, description: 이 캠페인으로 범위 제한 }
        - { name: formId, in: query, schema: { type: string }, description: 이 폼으로 범위 제한 }
      responses:
        "200":
          description: 채널별 성과
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    minItems: 5
                    maxItems: 5
                    items: { $ref: "#/components/schemas/ChannelStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── CRM 명단 ─────────────────────────────
  /api/admin/leads:
    get:
      tags: [CRM 명단]
      summary: 신청자 명단 (페이지네이션 · 검색 · CSV 내보내기)
      description: |
        신청 시각 최신순입니다.

        `q` 는 이름·이메일·연락처를 대소문자 구분 없이 부분 일치로 검색합니다 (`%` `_` 같은 와일드카드 문자는 글자 그대로 검색).

        `format=csv` 이면 필터에 맞는 명단 전체(최대 10,000건, 페이지네이션 무시)를 CSV 파일로 내려줍니다.
        - 엑셀 한글 호환을 위해 UTF-8 BOM 을 붙이고, 줄바꿈은 CRLF
        - 고정 8개 컬럼 뒤에 응답(payload) 필드가 키 이름순으로 이어집니다
        - 신청 시각은 Asia/Seoul 기준 `YYYY-MM-DD HH:mm:ss`, 링크 없는 신청의 채널은 `DIRECT`
        - `=` `+` `-` `@` 로 시작하는 값은 앞에 `'` 를 붙여 스프레드시트 수식 인젝션을 막습니다
      parameters:
        - { name: campaignId, in: query, schema: { type: string } }
        - { name: formId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 이름·이메일·연락처 부분 일치. 100자를 넘으면 앞 100자만 사용 }
        - { name: format, in: query, schema: { type: string, enum: [csv] }, description: csv 이면 파일 다운로드 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 }, description: 1 미만이거나 숫자가 아니면 1 로 보정 }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 }, description: 1~100 범위로 보정 }
      responses:
        "200":
          description: 명단 (JSON) 또는 CSV 파일
          headers:
            Content-Disposition:
              description: format=csv 일 때만
              schema: { type: string }
              example: 'attachment; filename="leads-2026-09-10.csv"'
          content:
            application/json:
              schema:
                type: object
                required: [leads, total, page, pageSize]
                properties:
                  leads:
                    type: array
                    items: { $ref: "#/components/schemas/Lead" }
                  total: { type: integer, description: 필터에 맞는 전체 건수 }
                  page: { type: integer }
                  pageSize: { type: integer }
            text/csv:
              schema: { type: string }
              example: |
                신청 시각,캠페인,폼,채널,링크 라벨,이름,이메일,연락처,agree,email,job,name,phone
                2026-09-10 12:00:00,9월 전자책 캠페인,전자책 신청,INSTAGRAM,스토리,홍길동,hong@example.com,010-1234-5678,yes,hong@example.com,직장인,홍길동,010-1234-5678
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── 공개 폼 (forms origin) ─────────────────────────────
  /f/{slug}:
    get:
      tags: [공개 폼 (forms origin)]
      summary: 공개 신청 폼 (HTML)
      description: |
        **forms origin** 에서 제공됩니다. 방문 1건이 기록되고 `lm_vid` 방문자 쿠키가 발급됩니다
        (방문마다 유효기간 1년으로 갱신, 이미 있으면 같은 값을 유지).
        `c` 로 배포 링크 코드를 넘기면 방문이 해당 링크·채널에 귀속됩니다 (없거나 모르는 코드는 DIRECT).

        응답 HTML 은 운영자가 등록한 HTML 스냅샷 + `</body>` 직전에 주입된 브릿지 스크립트입니다 (ADR-0003).

        마감(폼 비공개 또는 캠페인 PAUSED/ARCHIVED)이거나 없는 폼이면 **방문을 기록하지 않고** 안내 HTML 을 돌려줍니다.
      security: []
      servers: [{ url: http://localhost:3001 }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: c, in: query, schema: { type: string }, description: 배포 링크 코드 }
      responses:
        "200":
          description: 폼 HTML
          headers:
            Set-Cookie:
              schema: { type: string }
              example: "lm_vid=<uuid>; Path=/; Max-Age=31536000; HttpOnly; SameSite=Lax (프로덕션은 Secure 추가)"
            Content-Security-Policy:
              description: 업로드된 HTML 의 스크립트가 forms origin 밖으로 요청하지 못하게 한다 (ADR-0001)
              schema: { type: string }
              example: "default-src 'self' https: data: blob: 'unsafe-inline'; script-src 'self' https: 'unsafe-inline'; connect-src 'self'; form-action 'self'; frame-ancestors 'self' {ADMIN_ORIGIN}; base-uri 'self'; object-src 'none'"
            Referrer-Policy: { schema: { type: string }, example: strict-origin-when-cross-origin }
            X-Content-Type-Options: { schema: { type: string }, example: nosniff }
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            text/html: { schema: { type: string } }
        "404":
          description: 폼 없음 (안내 HTML, 같은 보안 헤더)
          content:
            text/html: { schema: { type: string } }
        "410":
          description: 마감 — 폼 비공개 또는 캠페인 PAUSED/ARCHIVED (안내 HTML, 같은 보안 헤더)
          content:
            text/html: { schema: { type: string } }

  /p/{slug}:
    get:
      tags: [공개 폼 (forms origin)]
      summary: 관리자 미리보기 (방문 미기록 · 제출 불가)
      description: |
        관리자 콘솔의 sandbox iframe 이 불러가는 경로입니다. 방문을 기록하지 않고, 브릿지가 preview 모드로 동작해 제출을 막습니다.
        **마감된 폼도 미리보기는 200** 입니다. 검색엔진 수집을 막는 `X-Robots-Tag: noindex` 가 추가됩니다.
      security: []
      servers: [{ url: http://localhost:3001 }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 폼 HTML (preview 모드). 보안 헤더는 /f/{slug} 와 같음
          headers:
            X-Robots-Tag: { schema: { type: string }, example: noindex }
          content:
            text/html: { schema: { type: string } }
        "404":
          description: 폼 없음 (안내 HTML)
          content:
            text/html: { schema: { type: string } }

  /api/public/forms/{slug}/submit:
    post:
      tags: [공개 폼 (forms origin)]
      summary: 신청 제출 (브릿지 스크립트가 호출)
      description: |
        브릿지가 `<form>` 의 `FormData` 를 평탄화해 보냅니다. 같은 `name` 이 여러 개면 배열.
        `name`/`email`/`phone`(및 한글 동의어) 필드는 CRM 컬럼으로 승격되고, 전체 필드는 `payload` 에 보존됩니다.
        `lm_vid` 쿠키가 있으면 리드에 방문자가 귀속되고, `code` 가 없거나 모르는 값이면 DIRECT 로 기록됩니다.

        검사 순서: 본문 크기(413) → 폼 존재(404) → 마감(410) → JSON 형식(400) → 필드 검증(400).
        공개 API 이므로 오류 메시지는 방문자에게 보여줄 수 있는 한국어 문장입니다.
      security: []
      servers: [{ url: http://localhost:3001 }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                code: { type: string, maxLength: 40, description: 배포 링크 코드 (페이지 URL 의 `c`) }
                fields:
                  type: object
                  minProperties: 1
                  maxProperties: 100
                  propertyNames: { minLength: 1, maxLength: 100 }
                  additionalProperties:
                    oneOf:
                      - { type: string, maxLength: 5000 }
                      - { type: array, items: { type: string, maxLength: 5000 }, maxItems: 50 }
            example:
              code: ig_3qpnyi0
              fields: { name: "홍길동", email: "hong@example.com", phone: "010-1234-5678", job: "직장인", agree: "yes" }
      responses:
        "201":
          description: 신청 저장됨
          content:
            application/json:
              schema:
                type: object
                required: [ok, leadId, message]
                properties:
                  ok: { type: boolean, const: true }
                  leadId: { type: string }
                  message: { type: string, description: 폼에 설정된 완료 메시지 }
        "400":
          description: JSON 이 아니거나 필드 검증 실패
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalidJson:
                  summary: JSON 이 아님
                  value: { error: "JSON 본문이 필요합니다" }
                validation:
                  summary: 필드 검증 실패
                  value: { error: "입력값이 올바르지 않습니다", details: { formErrors: [], fieldErrors: { fields: ["fields는 1~100개여야 합니다"] } } }
        "404":
          description: 폼 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "폼을 찾을 수 없습니다" }
        "410":
          description: 마감
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "신청이 마감되었습니다" }
        "413":
          description: 본문 64KB 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "요청이 너무 큽니다" }
