<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>무료 전자책 신청</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #eef2ff, #fdf2f8); font-family: -apple-system, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #111827; }
    .card { width: min(440px, 92vw); background: #fff; border-radius: 20px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(17, 24, 39, .12); }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p.lead { margin: 0 0 22px; color: #6b7280; font-size: 14px; line-height: 1.6; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input, select { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; }
    input:focus, select:focus { outline: 2px solid #6366f1; border-color: transparent; }
    .row { display: flex; gap: 10px; align-items: center; font-size: 13px; margin-top: 14px; }
    .row input { width: auto; }
    button { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 12px; background: #4f46e5; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:hover { background: #4338ca; }
    button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📘 무료 전자책 받기</h1>
    <p class="lead">“SNS로 첫 고객 만드는 법” PDF를 이메일로 보내드립니다. 아래 정보를 남겨 주세요.</p>
    <form id="lead-form">
      <label for="name">이름</label>
      <input id="name" name="name" required placeholder="홍길동" />

      <label for="email">이메일</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com" />

      <label for="phone">연락처 (선택)</label>
      <input id="phone" name="phone" type="tel" placeholder="010-0000-0000" />

      <label for="job">현재 상황</label>
      <select id="job" name="job">
        <option value="예비창업">예비창업</option>
        <option value="1인사업자">1인사업자</option>
        <option value="직장인">직장인</option>
        <option value="기타">기타</option>
      </select>

      <div class="row">
        <input id="agree" name="agree" type="checkbox" value="yes" required />
        <label for="agree" style="margin:0;font-weight:500">개인정보 수집·이용에 동의합니다</label>
      </div>

      <button type="submit">전자책 받기</button>
    </form>
  </main>
</body>
</html>
